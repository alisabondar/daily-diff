# The shared morning scrub (Phase 8, step 35).
# Runs at 09:17 and 10:17 UTC; `scrub --scheduled` keeps only the run that falls 05:00–06:59 America/New_York
# and skips if today is already published, so exactly one scrub goes out per day across daylight-saving changes.
# :17 avoids the top-of-hour queue. Manual runs (workflow_dispatch) always scrub.
#
# GitHub disables scheduled workflows in public repositories after 60 days with no repository activity, and
# disables them by default on forks:
# https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows
# The keepalive step below commits a marker when the last commit is older than 50 days.
name: scrub

on:
  schedule:
    - cron: '17 9 * * *'
    - cron: '17 10 * * *'
  workflow_dispatch:

permissions:
  contents: write # keepalive commit only

concurrency:
  group: scrub
  cancel-in-progress: false

jobs:
  scrub:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TZ: America/New_York
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
      LLM_MODEL: ${{ vars.LLM_MODEL }}
      LLM_FAST_MODEL: ${{ vars.LLM_FAST_MODEL }}
      LLM_EFFORT: ${{ vars.LLM_EFFORT }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      SCRUB_PROFILE: ${{ vars.SCRUB_PROFILE }}
      SCRUB_INCLUDE_REDDIT: ${{ vars.SCRUB_INCLUDE_REDDIT }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      AWS_BEARER_TOKEN_BEDROCK: ${{ secrets.AWS_BEARER_TOKEN_BEDROCK }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Scrub and publish
        run: npx tsx src/cli.ts scrub ${{ github.event_name == 'schedule' && '--scheduled' || '' }}
      - name: Keepalive
        if: success()
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 50 * 86400 )) ]; then
            mkdir -p scrub && date +%F > scrub/last-run
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add scrub/last-run && git commit -m 'scrub: keepalive' && git push
          fi
